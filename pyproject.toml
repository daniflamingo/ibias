[project]
name = "ibias"
version = "0.1.0"
description = "Infer the political leaning of news outlets from their word choice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4"]

[project.scripts]
ibias = "ibias.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibias = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
